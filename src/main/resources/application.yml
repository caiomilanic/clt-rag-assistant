spring:
  application:
    name: clt-rag-assistant

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:cltrag}
    username: ${POSTGRES_USER:cltrag}
    password: ${POSTGRES_PASSWORD:cltrag}

  ai:
    model:
      # Embeddings não vêm do Ollama: no passo 3 entra um EmbeddingModel da Voyage AI.
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
          # Respostas jurídicas: baixa criatividade, máxima aderência ao contexto.
          temperature: 0.2
          think: false

app:
  llm:
    model-label: ${OLLAMA_MODEL:qwen3:8b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
