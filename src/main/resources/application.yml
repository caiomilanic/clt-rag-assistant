spring:
  application:
    name: clt-rag-assistant

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:cltrag}
    username: ${POSTGRES_USER:cltrag}
    password: ${POSTGRES_PASSWORD:cltrag}

  ai:
    model:
      # Desligado até o passo 3, quando o provedor de embeddings passa a ser configurado por perfil
      # (offline: bge-m3 no Ollama; cloud: Voyage AI).
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Variante instruct: sem modo de raciocínio, cabe na GPU de 6 GB junto com o bge-m3 (D15).
          model: ${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}
          # Respostas jurídicas: baixa criatividade, máxima aderência ao contexto.
          temperature: 0.2

app:
  llm:
    model-label: ${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
