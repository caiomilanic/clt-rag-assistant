spring:
  application:
    name: clt-rag-assistant

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:cltrag}
    username: ${POSTGRES_USER:cltrag}
    password: ${POSTGRES_PASSWORD:cltrag}

  ai:
    model:
      # Perfil offline (D9): embeddings no Ollama. O perfil cloud (Voyage AI) entra no passo 6.
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          # Multilíngue, bom em português, 1024 dimensões; cabe na GPU junto com o modelo de chat.
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
      chat:
        options:
          # Variante instruct: sem modo de raciocínio, cabe na GPU de 6 GB junto com o bge-m3 (D15).
          model: ${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}
          # Respostas jurídicas: baixa criatividade, máxima aderência ao contexto.
          temperature: 0.2
          # Janela de contexto: pergunta + 5 trechos (alguns artigos passam de 1.000 tokens).
          # O padrão do Ollama (4096) pode cortar trechos. Custa ~0,6 GB a mais de VRAM.
          num-ctx: 8192
    vectorstore:
      pgvector:
        # Cria as extensões (vector, hstore, uuid-ossp), a tabela e o índice na primeira execução.
        initialize-schema: true
        table-name: trechos_normativos
        # Precisa bater com o modelo de embeddings (bge-m3 = 1024). Trocar de modelo exige recriar a tabela.
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW

app:
  corpus:
    # Relativo ao diretório de onde a aplicação é iniciada (a raiz do projeto).
    clt: ${CORPUS_CLT:corpus/clt/DEL5452.html}
  eval:
    # Conjunto de desenvolvimento (padrão) e de validação (D21); escolhido por ?conjunto= nas avaliações.
    arquivo: ${EVAL_ARQUIVO:docs/eval/eval-set.json}
    validacao: ${EVAL_VALIDACAO:docs/eval/validacao-set.json}
  busca:
    # artigo | dispositivo e vetorial | hibrida (D18). Sobrescrevíveis por pergunta na API de busca e nas avaliações.
    # Padrão escolhido pela medição de 2026-11-12: dispositivo + vetorial = 100% no top-5 (D18).
    granularidade: ${BUSCA_GRANULARIDADE:dispositivo}
    estrategia: ${BUSCA_ESTRATEGIA:vetorial}
  llm:
    model-label: ${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
